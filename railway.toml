[build]
dockerfile = "Dockerfile"

[deploy]
startCommand = "sh -c 'uvicorn api.main:app --host 0.0.0.0 --port $PORT'"
healthcheckPath = "/api/kpis"
restartPolicyType = "on_failure"

# ── Cron Railway (nécessite un service "sync-cron" créé manuellement dans le dashboard) ──
# Si le service cron n'existe pas, l'auto-sync au démarrage de l'API prend le relais.
[[services]]
name = "sync-cron"
cronSchedule = "0 6 * * *"
startCommand = "python sync/sync.py"
